name: Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Frontend
        run: |
          cd app
          npm install
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Windows Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build_pkg/MusicLess"
          Copy-Item "desktop_app.py" "build_pkg/MusicLess/"
          Copy-Item "run-musicless.bat" "build_pkg/MusicLess/"
          Copy-Item "README.md" "build_pkg/MusicLess/"
          Copy-Item "LICENSE" "build_pkg/MusicLess/"
          Copy-Item -Recurse "backend" "build_pkg/MusicLess/"
          Copy-Item -Recurse "app/dist" "build_pkg/MusicLess/app/dist"

          # Clean unwanted cache files
          Get-ChildItem -Path "build_pkg/MusicLess" -Recurse -Include __pycache__,"*.pyc","uploads","separated" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          # Compress to zip
          Compress-Archive -Path "build_pkg/MusicLess" -DestinationPath "MusicLess-Windows-v1.0.0.zip" -Force

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: MusicLess-Windows-v1.0.0.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
